[project]
name = "langgraph-postmortem-team"
version = "0.1.0"
description = "A planner / investigator / writer LangGraph team that drafts a blameless post-mortem from offline incident artifacts"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "opik>=2.3.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
postmortem = "postmortem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postmortem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
