[project]
name = "crewai-home-renovation-planner"
version = "0.1.0"
description = "A three-agent CrewAI crew that plans a kitchen and bath renovation, traced with Opik."
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
renovation-planner = "renovation_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renovation_planner"]
