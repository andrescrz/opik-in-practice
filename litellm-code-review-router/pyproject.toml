[project]
name = "litellm-code-review-router"
version = "0.1.0"
description = "Route the same code-review prompts to OpenAI and Anthropic through LiteLLM and compare cost and latency in Opik."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.79",
    "opik>=2.2.35",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
