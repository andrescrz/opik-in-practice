[project]
name = "openai-agents-insurance-claims"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.22.0",
    "opik>=2.3.5",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
