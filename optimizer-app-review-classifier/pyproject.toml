[project]
name = "optimizer-app-review-classifier"
version = "0.1.0"
description = "Classify fictional app-store reviews by intent with a prompt that gets tuned against a labeled set"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik>=2.3.6",
    "opik-optimizer>=3.2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
