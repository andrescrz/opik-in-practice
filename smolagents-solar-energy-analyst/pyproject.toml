[project]
name = "smolagents-solar-energy-analyst"
version = "0.1.0"
description = "A smolagents CodeAgent that hunts for anomalies in a solar farm's production CSV by writing pandas code"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "openinference-instrumentation-smolagents>=0.1.53",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "smolagents>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
