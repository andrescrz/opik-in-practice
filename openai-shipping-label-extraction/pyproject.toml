[project]
name = "openai-shipping-label-extraction"
version = "0.1.0"
description = "gpt-4o-mini reads fictional shipping-label images into a typed model, with Opik tracing, image attachments and a test suite"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pillow>=10.1",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
