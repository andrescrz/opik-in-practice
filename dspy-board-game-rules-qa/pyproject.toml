[project]
name = "dspy-board-game-rules-qa"
version = "0.1.0"
description = "A DSPy rules-QA program for a fictional board game that compiles its own few-shot prompt, measured in Opik."
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0",
    "opik>=2.3.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
rules-qa = "rules_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules_qa"]
