name: n8n-food-bank-volunteer-screening
services:
  n8n:
    build: .
    container_name: n8n-food-bank-volunteer-screening
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"       # log in over plain http://localhost
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
