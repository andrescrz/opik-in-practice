[project]
name = "langchain-fastapi-library-recs"
version = "0.1.0"
description = "A book-recommendation chat for a fictional branch library: LangChain + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "opik>=2.3.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
