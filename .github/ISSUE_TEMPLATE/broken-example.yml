name: Broken example
description: An example fails to run, or Opik shows something different from its README.
labels: [bug]
body:
  - type: input
    id: example
    attributes:
      label: Example folder
      placeholder: e.g. langgraph-national-parks-rag
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Paste the command and the error. Remove API keys and anything private first.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: OS, Python or Node version, Opik server version (or Opik Cloud)
