[project]
name = "openai-coworking-concierge"
version = "0.1.0"
description = "Front-desk chatbot for a fictional coworking space, traced with Opik"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.scripts]
concierge = "concierge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]
